# SonarQube analysis settings.
#
# The scan runs from CI (.github/workflows/ci.yml). It is the one job in this
# repository that needs a secret, so it is also the one that cannot run on a
# pull request from a fork — see the note in the workflow.
#
# The key and organisation below follow SonarQube Cloud's convention for a
# GitHub project, <owner>_<repo> and <owner>. If the project was created under
# a different key, or against a self-hosted SonarQube Server where the
# organisation does not apply, change them here rather than in the workflow.
sonar.projectKey=bkrbybk-org_wan-nee-la
sonar.organization=bkrbybk-org

# What to analyse. `scripts` holds the test harnesses and the palette
# generator, which are as worth checking as the Worker itself. `migrations`
# is SQL that Sonar reads but the app never imports.
#
# No `sonar.tests`. Naming `scripts` there as well as here made the two sets
# overlap, and the scanner aborts on that rather than picking one -- "can't be
# indexed twice". Declaring it would buy little anyway: these are plain Node
# programs that assert and exit, not a framework Sonar has coverage or test
# results to attribute, and palette.mjs is a generator that CI runs as a gate
# rather than a test at all.
sonar.sources=src,scripts,public/app.css,migrations

# `public/app.js` is the built client bundle — generated, minified, gitignored,
# and meaningless as a quality signal. `.wrangler` is local Miniflare state.
sonar.exclusions=node_modules/**,public/app.js,.wrangler/**,dist/**

# The test scripts are plain Node programs that assert and exit non-zero; they
# emit no coverage or JUnit report, so nothing is pointed at here. Sonar will
# therefore show 0% coverage, and a default Clean as You Code gate fails new
# code on it. Either accept it, relax the coverage condition on the gate, or
# produce a report first — but do not point this at a file that does not exist,
# which fails the scan outright.

# UTF-8 throughout: the string catalogue is half Thai.
sonar.sourceEncoding=UTF-8
